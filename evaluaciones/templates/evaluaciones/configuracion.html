{% extends 'evaluaciones/base.html' %}{% block content %}
<h2>Configuración del sistema</h2>
<div class="card"><p>Solo el Administrador puede cambiar estas opciones. Las evaluaciones existentes conservan el método con el que se crearon.</p>
<form method="post">{% csrf_token %}
<h3>Método de importancia sugerida</h3>
<label><input type="radio" name="metodo_importancia" value="TESIS" {% if config.metodo_importancia == 'TESIS' %}checked{% endif %} style="width:auto"> <strong>Tesis</strong> — utiliza los valores de referencia del catálogo y la matriz IE/IL.</label><br>
<label><input type="radio" name="metodo_importancia" value="IA" {% if config.metodo_importancia == 'IA' %}checked{% endif %} style="width:auto"> <strong>Gemini IA</strong> — propone la importancia sugerida a partir del contexto.</label>
<h3>Registro público</h3>
<label><input type="checkbox" name="registro_abierto" {% if config.registro_abierto %}checked{% endif %}> Permitir que cualquier persona cree una cuenta de Evaluador. Si se desactiva, solo el Administrador crea usuarios desde el panel.</label><br>
<button type="submit">Guardar configuración</button></form></div>
{% endblock %}
