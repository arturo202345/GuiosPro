services:
  - type: web
    name: guios-pro
    runtime: python
    # importar_catalogo es seguro en cada despliegue: no hace nada si el catálogo ya existe.
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py configurar_roles && python manage.py importar_catalogo"
    # --timeout 120: el autocompletado con Gemini puede tardar más que los 30 s por defecto.
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: guios-pro-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: '0'
      - key: DJANGO_ALLOWED_HOSTS
        value: '.onrender.com'
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: guios-pro-db
    databaseName: guiospro
    user: guiospro
